# Motion Hub 动效实验台：https://motion.lijunyu.com.cn
# 静态文件，由 motion-hub 仓库的 deploy/deploy.sh 同步到 /www/wwwroot/motion.lijunyu.com.cn/
# 证书：Let's Encrypt（宝塔 acme_v2 签发），放在 vhost/cert/motion.lijunyu.com.cn/；宝塔续签时会替换这里同域名的证书并重载 nginx
server {
    listen 80;
    listen [::]:80;
    server_name motion.lijunyu.com.cn;
    # 签发 / 续签证书的验证文件
    location ^~ /.well-known/acme-challenge/ { root /www/wwwroot/panel_ssl_site; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 443 quic;
    listen [::]:443 quic;
    http2 on;
    server_name motion.lijunyu.com.cn;
    root /www/wwwroot/motion.lijunyu.com.cn;
    index index.html;

    ssl_certificate     /www/server/panel/vhost/cert/motion.lijunyu.com.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/motion.lijunyu.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ /\. { return 404; }
    # HTML / JS / CSS 每次向服务器确认（没变就 304），改版后访客立刻拿到新版本；图片缓存 7 天
    location ~* \.(html?|css|js|json|md)$ { add_header Cache-Control "no-cache" always; add_header Strict-Transport-Security "max-age=31536000" always; add_header X-Content-Type-Options nosniff always; }
    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2?)$ { expires 7d; access_log off; }
    location / { try_files $uri $uri/ =404; }

    access_log /www/wwwlogs/motion.lijunyu.com.cn.log;
    error_log  /www/wwwlogs/motion.lijunyu.com.cn.error.log;
}
