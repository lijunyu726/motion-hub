<!doctype html>
<!--
  「拉扯翻页」 · Motion Hub · MIT + Commons Clause（可免费用于任何项目，不能售卖效果本身）

  【怎么用】
  这个文件可以直接双击打开，先看效果。
  想放进自己的项目：把整个文件交给 AI（Claude / ChatGPT / Cursor 等），再说一句你的技术栈和想要的调整，
  例如“把这个效果改写成 React 组件，放在首屏当背景，颜色换成我的品牌色”。下面的说明就是写给它看的。

  【效果】
  一页一屏，像放幻灯片。往下翻时，当前页上的信息先被往下扯长，再整体拽走并淡出，下一页稍后从上方浮现；往上翻时，上一页从底部被拉上来并轻轻回弹。也可以按住拖动：拖过两成屏高或甩得够快就翻页，否则弹回。背景不参与。

  【实现原理】
  - 把要被扯走的那一页 cloneNode 一份，横切成 N 条（N ≈ 屏高 / 24）。每条是一个 overflow:hidden 的窄条，里面放整页副本并向上偏移。
  - 每条的竖向位移 D(y) = p × (g + (1 - g) × e^(-(gy - y) / L))：p 是拉动距离，gy 是抓点，g 是“整体跟上”的比例。抓点上方的部分按距离指数衰减地落后，所以被拉长；抓点下方整体跟着走。
  - 每条用 translateY(D(y0)) scaleY((h + D(y1) - D(y0)) / h)，相邻条的接口永远对得上。
  - 自动翻页分两段：先扯 14% 屏高（g = 0，只拉长），再 ease-in 拽走，同时 g 从 0 到 1。
  - 拖动时用指针速度判断“甩”：松手速度大于 0.9px/ms 也算完成。

  【可以调的参数】
  - 切条高度约 24px
  - 先扯的幅度 14% 屏高
  - 衰减长度 L = 0.35 × 屏高
  - 完成阈值 22% 屏高或 0.9px/ms
  - 回弹用 back 缓动

  【注意】
  - 只做竖向拉伸，不要横向缩放：同一个字跨好几条，每条横向比例不同，边缘会错成台阶。
  - 切条按整数像素对齐、互不重叠。快照是透明的，重叠会让接缝处的文字被画两遍，出现一道深线。
  - 快照只复制页面信息，不要把背景一起切进去，否则和底下实时运行的背景对不上。
  - 不适合整站都这样翻页（太慢）。更适合作品放映、幻灯片这类场景。
  - 颜色都来自 CSS 变量（paper / ink / dim / rule / accent），换成项目自己的颜色即可。
  - 要处理 prefers-reduced-motion：系统要求减少动态效果时只显示静止画面。
  - 组件卸载时要停掉动画循环、移除事件监听（mount 返回的 destroy）。

  【opts 参数】（mount 的第二个参数，不传就用默认值；文件末尾的 mount 调用里是你在 Motion Hub 上调好的值）
  - slides：每页内容（一行一页：标题 | 说明），默认 "背景 | 等高线 · 点阵 · 风场 · 网格\n过渡 | 11 种深浅切换\n翻页 | 拉扯翻页\n交互 | 片头 · 开关 · 卡片 · 光标"

  【代码结构】
  - <style>：配色变量和这个效果用到的样式
  - 第一段 <script>：MH 核心（注册表、噪声、缓动；canvasHost 负责画布尺寸、指针坐标、动画循环和暂停）
  - 第二段 <script>：效果本身，核心是 MH.register 里的 mount(el, opts)，返回 { pause, resume, destroy }
  - 最后一段 <script>：把效果挂到 #fx 上并启动
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拉扯翻页</title>
<style>
/* Motion Hub 效果样式：配色变量（Acid：浅色暖灰 + 紫罗兰，深色近黑 + 酸橙绿）+ 各效果用到的样式 + 整页过渡遮罩。按“@css 名称”标记分段，复制代码时只带用到的段。 */
:root{
  --paper:#F1F0EC;--paper2:#E4E2DC;--ink:#141316;--body:#3A383F;--dim:#85828C;--rule:#D6D3CC;--accent:#6B4EFF;--on-accent:#fff;--hi:#C6F21E;
  --serif:"Songti SC","STSong","Noto Serif SC",serif;
  --sans:"PingFang SC","Helvetica Neue","Noto Sans SC",sans-serif;
  --latin:"Iowan Old Style",Palatino,Georgia,serif;
  --mono:"SF Mono",Menlo,monospace;
}
[data-theme="night"]{--paper:#111113;--paper2:#1B1B1F;--ink:#F2F1F5;--body:#C4C2CC;--dim:#7E7B88;--rule:#2A2A30;--accent:#C6F21E;--on-accent:#111113;--hi:#8E75FF}
[data-theme="day"]{--paper:#F1F0EC;--paper2:#E4E2DC;--ink:#141316;--body:#3A383F;--dim:#85828C;--rule:#D6D3CC;--accent:#6B4EFF;--on-accent:#fff;--hi:#C6F21E}

/* 拉扯翻页 */
.pd{position:absolute;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:grab}
.pd:active{cursor:grabbing}
.pd-slide{position:absolute;inset:0;display:none;align-items:center;gap:6cqw;padding:0 8cqw}
.pd-slide.on{display:flex}
.pd-n{font:italic 400 30cqh/.8 var(--latin);color:transparent;-webkit-text-stroke:1.5px var(--accent)}
.pd-slide h3{font:900 9cqh/1.1 var(--serif)}
.pd-slide p{margin-top:2cqh;font:400 3.4cqh/1.6 var(--serif);color:var(--body)}
.pd-pn{position:absolute;right:20px;bottom:16px;font:500 12px/1 var(--mono);color:var(--accent)}
.pd-sheet{position:absolute;inset:0;pointer-events:none;z-index:5}
.pd-band{position:absolute;left:0;width:100%;overflow:hidden;transform-origin:0 0;will-change:transform}
.pd-band>.pd-slide{display:flex}
html,body{height:100%;margin:0;background:var(--paper)}
#fx{position:relative;height:100vh;overflow:hidden;container-type:size}
</style>
</head>
<body>
<div id="fx"></div>
<script>
// Motion Hub 核心：注册表 + 公共工具。所有效果文件都是普通 <script>（不是 ES 模块），
// 这样直接双击 index.html（file://）也能运行。每个效果调用 MH.register({...}) 把自己登记进来。
//
// 效果对象的约定：
//   id      唯一标识（小写短横线）
//   name    中文名
//   cat     分类：背景 / 过渡 / 翻页 / 片头 / 交互
//   tech    用到的技术（展示用）
//   desc    一句话说明
//   mount(el, opts) → { pause(), resume(), destroy() }
//     el 是一个已经有尺寸的容器；opts.expanded 为 true 表示全屏体验（关掉幽灵光标、允许滚轮等）
//   params  可调参数（可选），实验台据此生成参数面板，每项 { k, label, type, def, ... }：
//     type 'range'：数值滑块，带 min / max / step，可选 unit；'text'：单行文字；'lines'：多行文字，一行一项
//     mount 拿到的 opts 已经按 def 补齐（register 里包了一层），效果代码直接读 opts.k 即可
window.MH = (() => {
  const effects = [];
  // 记下效果来自哪个文件（复制代码时只带这个文件）
  const register = e => {
    const src = document.currentScript && document.currentScript.src; e.file = e.file || (src ? src.split('/').pop() : '');
    if (e.params) { const m = e.mount; e.mount = (el, opts = {}) => m.call(e, el, { ...defaults(e), ...opts }); }
    effects.push(e);
  };
  const defaults = e => Object.fromEntries((e.params || []).map(p => [p.k, p.def]));
  // 'lines' 参数：数组原样返回；字符串按行拆开，去掉空行
  const lines = v => Array.isArray(v) ? v : String(v || '').split('\n').map(x => x.trim()).filter(Boolean);
  const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const ease = {
    in: t => t * t * t,
    out: t => 1 - (1 - t) ** 3,
    inOut: t => t < .5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2,
    back: t => { const c = 1.4; return 1 + (c + 1) * (t - 1) ** 3 + c * (t - 1) ** 2; },
  };
  const hash = i => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

  // 二维 Perlin 噪声，seed 决定排列表
  function perlin(seed = 1) {
    const P = new Uint8Array(512), p = [...Array(256).keys()];
    let s = seed;
    for (let i = 255; i > 0; i--) { s = (s * 16807) % 2147483647; const j = s % (i + 1); [p[i], p[j]] = [p[j], p[i]]; }
    for (let i = 0; i < 512; i++) P[i] = p[i & 255];
    const fade = t => t * t * t * (t * (t * 6 - 15) + 10), grad = (h, x, y) => ((h & 1) ? -x : x) + ((h & 2) ? -y : y);
    return (x, y) => {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255; x -= Math.floor(x); y -= Math.floor(y);
      const u = fade(x), v = fade(y), a = P[X] + Y, b = P[X + 1] + Y;
      const l1 = grad(P[a], x, y) + u * (grad(P[b], x - 1, y) - grad(P[a], x, y));
      const l2 = grad(P[a + 1], x, y - 1) + u * (grad(P[b + 1], x - 1, y - 1) - grad(P[a + 1], x, y - 1));
      return l1 + v * (l2 - l1);
    };
  }

  // 画布按设备像素比放大，画的时候仍用 CSS 像素坐标
  function fit(cv, w, h) {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); return ctx;
  }
  // 从容器读主题色（--paper / --ink / --dim / --rule / --accent）
  function colors(el) {
    const cs = getComputedStyle(el), v = n => cs.getPropertyValue(n).trim();
    const t = el.closest('[data-theme]');
    return { paper: v('--paper'), ink: v('--ink'), dim: v('--dim'), rule: v('--rule'), accent: v('--accent'), night: !!t && t.dataset.theme === 'night' };
  }
  // 一段时长 ms 的补间，fn(k) 中 k 从 0 到 1；减少动态效果时直接到终点
  const tween = (ms, fn) => new Promise(res => {
    if (still()) { fn(1); return res(); }
    const t0 = performance.now();
    const f = now => { const k = clamp((now - t0) / ms); fn(k); k < 1 ? requestAnimationFrame(f) : res(); };
    requestAnimationFrame(f);
  });
  // 尺寸缩放系数：全屏约 1，缩略图约 0.45，让小画面像“整页缩小”而不是挤满细节
  const scaleOf = W => clamp(W / 1200, .45, 1);

  // 幽灵光标：没人操作时，沿一条利萨如曲线在容器里慢慢移动，让缩略图自己演示交互
  const ghostAt = (now, W, H, seed = 0) => {
    const t = now / 1000 + seed * 7;
    return { x: W * (.5 + .32 * Math.sin(t * .55) * Math.cos(t * .21)), y: H * (.5 + .3 * Math.sin(t * .83 + 1.3)) };
  };

  // 效果宿主：（可选）建画布、跟随尺寸、换算局部指针坐标、管动画循环和暂停。
  // setup(h) 返回 { resize(W,H), frame(now), down(x,y), theme(), ghostClick }，h 提供 ctx / W / H / P / s / colors()
  // ghostClick: false 表示幽灵光标不替它“点击”（例如片头，点一下会重播）
  function canvasHost(el, opts, setup, { canvas = true } = {}) {
    const cv = canvas ? document.createElement('canvas') : null;
    if (cv) { cv.className = 'mh-canvas'; el.append(cv); }
    let ctx, W = 0, H = 0, raf = 0, running = false, lastReal = -1e9, lastGhostClick = 0;
    const P = { x: -9999, y: -9999, real: false };
    const seed = hash(effects.length + el.childElementCount);
    const h = { cv, get ctx() { return ctx; }, get W() { return W; }, get H() { return H; }, P, s: 1, colors: () => colors(el), expanded: !!opts.expanded };
    const api = setup(h);
    const size = () => {
      const r = el.getBoundingClientRect(); if (!r.width || !r.height) return;
      W = r.width; H = r.height; h.s = scaleOf(W); if (cv) ctx = fit(cv, W, H); api.resize && api.resize(W, H);
      if (!running) api.frame(performance.now());
    };
    const ro = new ResizeObserver(size); ro.observe(el);
    const local = e => { const r = el.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    const onMove = e => { [P.x, P.y] = local(e); P.real = true; lastReal = performance.now(); };
    const onLeave = () => { P.real = false; P.x = P.y = -9999; };
    const onDown = e => { if (e.target.closest('a, button')) return; lastReal = performance.now(); const [x, y] = local(e); api.down && api.down(x, y); };
    el.addEventListener('pointermove', onMove); el.addEventListener('pointerleave', onLeave); el.addEventListener('pointerdown', onDown);
    const mo = new MutationObserver(() => { api.theme && api.theme(); if (!running) api.frame(performance.now()); });
    mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'data-palette'] });
    const tick = now => {
      if (!running) return;
      // 缩略图里 2.5 秒没人碰，就让幽灵光标接管；偶尔“点”一下展示点击效果
      if (!h.expanded && now - lastReal > 2500) {
        const g = ghostAt(now, W, H, seed); P.x = g.x; P.y = g.y;
        if (api.down && api.ghostClick !== false && now - lastGhostClick > 4200) { lastGhostClick = now; api.down(g.x, g.y); }
      }
      if (W && H) api.frame(now);
      raf = requestAnimationFrame(tick);
    };
    size();
    return {
      pause() { running = false; cancelAnimationFrame(raf); },
      resume() { if (running) return; if (still()) { api.frame(performance.now()); return; } running = true; raf = requestAnimationFrame(tick); },
      destroy() { this.pause(); ro.disconnect(); mo.disconnect(); el.removeEventListener('pointermove', onMove); el.removeEventListener('pointerleave', onLeave); el.removeEventListener('pointerdown', onDown); cv && cv.remove(); },
    };
  }

  // 让 CSS 能对自定义属性做补间（遮罩半径等）
  if (window.CSS && CSS.registerProperty) {
    for (const name of ['--vr', '--vw']) { try { CSS.registerProperty({ name, syntax: '<length>', inherits: false, initialValue: '0px' }); } catch (e) { /* 已注册 */ } }
  }

  return { effects, register, defaults, lines, still, clamp, lerp, ease, hash, perlin, fit, colors, tween, scaleOf, ghostAt, canvasHost };
})();
</script>
<script>
// 拉扯翻页：一页一屏，换页时只有页面上的信息被扯长、扯走，背景不动。
// 做法：把要被扯走的那一页复制一份，横切成很多细条；每条按离“抓点”的远近做竖向位移和拉伸，拼起来就是被拉长的样子。
// 只做竖向（横向不缩放），字的边缘才是连续的，没有台阶。
MH.register({
  id: 'pull', name: '拉扯翻页', cat: '翻页', tech: 'DOM Slicing · Exponential Decay · Pointer Drag',
  desc: '往下翻，当前页的信息先被扯长，再整体拽走；往上翻，上一页从底部被拉上来。也可以按住拖动，拖过两成或甩得够快就翻页，否则弹回。',
  usage: `const deck = MH.effects.find(e => e.id === 'pull').mount(el, { slides: ['…', '…'] });\ndeck.resume();`,
  params: [
    { k: 'slides', label: '每页内容（一行一页：标题 | 说明）', type: 'lines', def: '背景 | 等高线 · 点阵 · 风场 · 网格\n过渡 | 11 种深浅切换\n翻页 | 拉扯翻页\n交互 | 片头 · 开关 · 卡片 · 光标' },
  ],
  mount(el, opts) {
    // slides 可以是 [[编号, 标题, 说明], …]，也可以是“标题 | 说明”一行一页的文字
    const PAGES = MH.lines(opts.slides).map((l, i) => Array.isArray(l) ? l : [String(i + 1).padStart(2, '0'), ...l.split('|').map(x => x.trim())].concat('').slice(0, 3));
    if (!PAGES.length) PAGES.push(['01', '', '']);
    el.insertAdjacentHTML('beforeend', `<div class="pd">${PAGES.map(([n, t, d]) => `<section class="pd-slide"><div class="pd-n">${n}</div><div><h3>${t}</h3><p>${d}</p></div></section>`).join('')}<div class="pd-pn"></div></div>`);
    const box = el.lastElementChild, slides = [...box.querySelectorAll('.pd-slide')], pn = box.querySelector('.pd-pn');
    const { clamp, lerp, ease, tween } = MH;
    let cur = 0, busy = false, dirStep = 1, running = false, timer = 0, lastReal = -1e9;
    slides[0].classList.add('on');
    const paint = () => { pn.textContent = `${String(cur + 1).padStart(2, '0')} / ${String(slides.length).padStart(2, '0')}`; };
    paint();

    // 快照切条：整数像素对齐，静止时不重叠也没有缝
    function sheetOf(node) {
      const W = box.clientWidth, H = box.clientHeight, N = Math.max(16, Math.round(H / 24));
      const sheet = document.createElement('div'); sheet.className = 'pd-sheet';
      const strips = [];
      for (let i = 0; i < N; i++) {
        const y0 = Math.floor(i * H / N), y1 = Math.floor((i + 1) * H / N);
        const s = document.createElement('div'); s.className = 'pd-band'; s.style.top = y0 + 'px'; s.style.height = y1 - y0 + 'px';
        const c = node.cloneNode(true); c.classList.add('on'); c.style.cssText = `top:${-y0}px;height:${H}px;opacity:1;transform:none`;
        s.append(c); sheet.append(s); strips.push({ el: s, y0, y1 });
      }
      box.append(sheet);
      return { sheet, strips, H };
    }
    // dir=down：抓点 gy 上方按距离指数衰减地跟随（被拉长），下方整体跟走；dir=up：上沿领先、下面落后。g 是整体跟上的比例
    function place(S, { dir, p, g, L, gy }) {
      const H = S.H;
      const D = dir === 'down' ? y => p * (g + (1 - g) * (y >= gy ? 1 : Math.exp(-(gy - y) / L))) : y => H - p * (g + (1 - g) * Math.exp(-y / L));
      for (const s of S.strips) { const a = D(s.y0), b = D(s.y1), h = s.y1 - s.y0; s.el.style.transform = `translate3d(0,${a}px,0) scaleY(${Math.max(.2, (h + b - a) / h)})`; }
    }
    const enter = (e, k, from) => { e.style.opacity = k; e.style.transform = `translateY(${(1 - k) * from}px)`; };
    const reset = e => { e.style.opacity = ''; e.style.transform = ''; };

    async function go(to) {
      if (busy || to === cur) return;
      const H = box.clientHeight, off = 28 * MH.scaleOf(box.clientWidth);
      if (to < 0 || to >= slides.length) { // 到头：拽动一点又弹回
        busy = true; const e = slides[cur], d = to > cur ? 1 : -1;
        await tween(160, k => e.style.transform = `translateY(${d * 34 * ease.out(k)}px) scaleY(${1 + .03 * ease.out(k)})`);
        await tween(380, k => e.style.transform = `translateY(${d * 34 * (1 - ease.back(k))}px)`);
        reset(e); busy = false; return;
      }
      busy = true;
      const from = slides[cur], next = slides[to];
      if (to > cur) { // 下一页：当前页的信息先被往下扯长，再整体拽走、淡出；下一页稍后从上方浮现
        const S = sheetOf(from), L = H * .35;
        from.classList.remove('on'); next.classList.add('on'); enter(next, 0, -off); cur = to; paint();
        await tween(320, k => place(S, { dir: 'down', p: H * .14 * ease.out(k), g: 0, L, gy: H }));
        await tween(440, k => { place(S, { dir: 'down', p: lerp(H * .14, H * 1.1, ease.in(k)), g: ease.inOut(k), L, gy: H }); S.sheet.style.opacity = 1 - clamp((k - .1) / .6); enter(next, ease.out(clamp((k - .45) / .55)), -off); });
        reset(next); S.sheet.remove();
      } else { // 上一页：从底部探出头，被扯着上沿拉到顶，轻轻回弹；当前页往上淡出
        const S = sheetOf(next), L = H * .4;
        place(S, { dir: 'up', p: 0, g: 0, L, gy: 0 }); S.sheet.style.opacity = 0;
        await tween(180, k => { place(S, { dir: 'up', p: 46 * ease.out(k), g: 0, L, gy: 0 }); S.sheet.style.opacity = k; });
        await tween(300, k => { place(S, { dir: 'up', p: lerp(46, H * .32, ease.out(k)), g: 0, L, gy: 0 }); from.style.opacity = 1 - .6 * k; from.style.transform = `translateY(${-24 * k}px)`; });
        await tween(460, k => { place(S, { dir: 'up', p: lerp(H * .32, H, ease.back(k)), g: ease.out(k), L, gy: 0 }); from.style.opacity = .4 * (1 - ease.out(k)); });
        from.classList.remove('on'); reset(from); next.classList.add('on'); cur = to; paint(); S.sheet.remove();
      }
      busy = false;
    }

    // 输入：舞台上滚轮、方向键；按住拖动（指针按住的地方就是抓点）
    let acc = 0, coolUntil = 0, drag = null;
    const onWheel = e => {
      e.preventDefault(); lastReal = performance.now();
      if (busy || performance.now() < coolUntil) return;
      acc += e.deltaY;
      if (Math.abs(acc) > 40) { const d = acc > 0 ? 1 : -1; acc = 0; coolUntil = performance.now() + 900; go(cur + d); }
    };
    const onKey = e => {
      if (!box.isConnected || !running) return;
      if (['ArrowDown', 'PageDown'].includes(e.key)) { e.preventDefault(); lastReal = performance.now(); go(cur + 1); }
      if (['ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); lastReal = performance.now(); go(cur - 1); }
    };
    const pose = (dir, dy, H) => dir === 'down'
      ? (p => ({ p, g: clamp(p / (H * .9)) ** 2, q: clamp(p / (H * .5)) }))(Math.max(0, dy))
      : (p => ({ p, g: clamp(p / (H * .9)) ** 2, q: clamp(p / (H * .6)) }))(clamp(-dy * 1.15, 0, H));
    const onDown = e => {
      if (busy || e.button > 0 || e.target.closest('a, button')) return;
      const r = box.getBoundingClientRect(); lastReal = performance.now();
      drag = { y: e.clientY, gy: e.clientY - r.top, v: 0, ly: e.clientY, lt: performance.now(), S: null, dir: null };
      box.setPointerCapture(e.pointerId);
    };
    const onMove = e => {
      if (!drag) return;
      const dy = e.clientY - drag.y, now = performance.now(), H = box.clientHeight, off = 28 * MH.scaleOf(box.clientWidth);
      drag.v = (e.clientY - drag.ly) / Math.max(1, now - drag.lt); drag.ly = e.clientY; drag.lt = now; lastReal = now;
      if (!drag.dir) {
        if (Math.abs(dy) < 8) return;
        drag.dir = dy > 0 ? 'down' : 'up';
        const to = cur + (drag.dir === 'down' ? 1 : -1);
        if (to < 0 || to >= slides.length) { drag.edge = true; return; }
        busy = true; drag.to = to;
        if (drag.dir === 'down') { drag.S = sheetOf(slides[cur]); slides[cur].classList.remove('on'); slides[to].classList.add('on'); enter(slides[to], 0, -off); }
        else drag.S = sheetOf(slides[to]);
      }
      if (drag.edge) { const d = dy * .18; slides[cur].style.transform = `translateY(${d}px) scaleY(${1 + Math.abs(d) / H * .6})`; return; }
      const { p, g, q } = pose(drag.dir, dy, H);
      if (drag.dir === 'down') { place(drag.S, { dir: 'down', p, g, L: H * .3, gy: drag.gy }); drag.S.sheet.style.opacity = 1 - .7 * q; enter(slides[drag.to], .8 * q, -off); }
      else { place(drag.S, { dir: 'up', p, g, L: H * .4, gy: 0 }); drag.S.sheet.style.opacity = clamp(p / (H * .15)); slides[cur].style.opacity = 1 - .8 * q; slides[cur].style.transform = `translateY(${-30 * q}px)`; }
    };
    const onUp = async e => {
      const d = drag; drag = null;
      if (!d || !d.dir) return;
      const H = box.clientHeight, off = 28 * MH.scaleOf(box.clientWidth);
      if (d.edge) { const e2 = slides[cur], m = /translateY\(([-\d.]+)px\)/.exec(e2.style.transform), y0 = m ? +m[1] : 0; await tween(320, k => e2.style.transform = `translateY(${y0 * (1 - ease.back(k))}px)`); reset(e2); return; }
      const dy = e.clientY - d.y, { p: p0, g: g0, q: q0 } = pose(d.dir, dy, H);
      const done = d.dir === 'down' ? (dy > H * .22 || d.v > .9) : (-dy > H * .22 || d.v < -.9);
      const from = slides[cur], next = slides[d.to];
      if (d.dir === 'down') {
        if (done) { await tween(360, k => { place(d.S, { dir: 'down', p: lerp(p0, H * 1.1, ease.in(k)), g: lerp(g0, 1, ease.out(k)), L: H * .3, gy: d.gy }); d.S.sheet.style.opacity = (1 - .7 * q0) * (1 - k); enter(next, lerp(.8 * q0, 1, ease.out(k)), -off); }); reset(next); cur = d.to; paint(); }
        else { await tween(420, k => { place(d.S, { dir: 'down', p: p0 * (1 - ease.back(k)), g: g0 * (1 - k), L: H * .3, gy: d.gy }); d.S.sheet.style.opacity = lerp(1 - .7 * q0, 1, k); enter(next, .8 * q0 * (1 - k), -off); }); next.classList.remove('on'); reset(next); from.classList.add('on'); }
      } else {
        if (done) { await tween(420, k => { place(d.S, { dir: 'up', p: lerp(p0, H, ease.back(k)), g: lerp(g0, 1, ease.out(k)), L: H * .4, gy: 0 }); d.S.sheet.style.opacity = 1; from.style.opacity = (1 - .8 * q0) * (1 - k); }); from.classList.remove('on'); reset(from); next.classList.add('on'); cur = d.to; paint(); }
        else { await tween(360, k => { place(d.S, { dir: 'up', p: p0 * (1 - ease.out(k)), g: g0 * (1 - k), L: H * .4, gy: 0 }); enter(from, lerp(1 - .8 * q0, 1, k), 0); from.style.transform = `translateY(${-30 * q0 * (1 - k)}px)`; }); reset(from); }
      }
      d.S.sheet.remove(); busy = false;
    };
    box.addEventListener('wheel', onWheel, { passive: false });
    box.addEventListener('pointerdown', onDown); box.addEventListener('pointermove', onMove); box.addEventListener('pointerup', onUp); box.addEventListener('pointercancel', onUp);
    addEventListener('keydown', onKey);
    // 没人操作时自动来回翻：到最后一页就往回翻
    const auto = () => {
      if (!running) return;
      if (performance.now() - lastReal > 3500 && !busy) {
        if (cur + dirStep < 0 || cur + dirStep >= slides.length) dirStep = -dirStep;
        go(cur + dirStep);
      }
      timer = setTimeout(auto, 2400);
    };
    return {
      pause() { running = false; clearTimeout(timer); },
      resume() { if (running) return; running = true; if (!MH.still()) timer = setTimeout(auto, 1600); },
      destroy() { this.pause(); removeEventListener('keydown', onKey); box.remove(); },
    };
  },
});
</script>
<script>
MH.effects.find(e => e.id === 'pull').mount(document.getElementById('fx'), {
  "slides": [
    "背景 | 等高线 · 点阵 · 风场 · 网格",
    "过渡 | 11 种深浅切换",
    "翻页 | 拉扯翻页",
    "交互 | 片头 · 开关 · 卡片 · 光标"
  ]
}).resume();
</script>
</body>
</html>
