name: 问题反馈
description: 某个效果显示不对、报错或卡顿
labels: [bug]
body:
  - type: input
    id: effect
    attributes:
      label: 哪个效果
      placeholder: 例如 等高线 / theme-dots
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么，期望是什么
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 浏览器和系统
      placeholder: 例如 Chrome 140 / macOS 16
