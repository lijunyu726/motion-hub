<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Hub · 网页动效合集</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://motion.lijunyu.com.cn/">
<meta name="description" content="网页动效合集：背景、深浅切换过渡、拉扯翻页、片头与小交互。原生 JavaScript（Vanilla JS），零依赖。">
<script>
  // 先定深浅色再渲染，避免闪一下：默认浅色（不跟随系统），用户切过就记住
  (() => { let m = null; try { m = localStorage.getItem('mh-theme'); } catch (e) {}
    if (m === 'night') document.documentElement.dataset.theme = 'night'; })();
</script>
<link rel="stylesheet" href="src/effects.css">
<link rel="stylesheet" href="src/hub.css">
<style id="accent-css"></style>
<script src="src/core.js"></script>
<script src="src/effects/contour.js"></script>
<script src="src/effects/dots.js"></script>
<script src="src/effects/flow.js"></script>
<script src="src/effects/grid.js"></script>
<script src="src/effects/transitions.js"></script>
<script src="src/effects/pull.js"></script>
<script src="src/effects/intro.js"></script>
<script src="src/effects/sun-moon.js"></script>
<script src="src/effects/glow-card.js"></script>
<script src="src/effects/scramble.js"></script>
<script src="src/effects/follow-tip.js"></script>
<script src="src/effects/pipeline.js"></script>
<script src="src/prompts.js"></script>
<script src="src/sources.js"></script>
</head>
<body>
<header class="hd">
  <a class="logo" href="#">MOTION HUB</a>
  <span class="count" id="count"></span>
  <nav>
    <a href="skill/motion-hub.zip" download title="下载 Agent Skill：把 23 个效果交给 Claude 等 AI 直接用">Skill ↓</a>
    <a href="https://github.com/lijunyu726/motion-hub" target="_blank" rel="noopener">GitHub</a>
    <button class="sm" id="mode" type="button"></button>
  </nav>
</header>
<div class="bench">
  <aside class="list" id="list" aria-label="效果列表"></aside>
  <main class="main">
    <div class="stage" id="stage" data-theme="day"><!-- 预览固定浅色，不跟着网站的深浅切换 --></div>
    <section class="info">
      <div>
        <div class="cat" id="cat"></div>
        <h1 id="name"></h1>
        <p id="desc"></p>
        <div class="tech" id="tech"></div>
        <div class="act"><button id="reset" type="button">↻ 重置</button><button id="full" type="button">⛶ 全屏</button></div>
      </div>
      <div class="params" id="params" aria-label="参数"></div>
      <div class="use"><pre id="use"></pre><div class="copies"><button class="copy p" id="copy" type="button">复制 Prompt + 代码</button></div></div>
    </section>
  </main>
</div>
<footer class="ft-bar">
  <span>MIT + Commons Clause · © 2026 LJY · Vanilla JS · Zero Dependencies</span>
  <span><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">鲁ICP备2026056774号-1</a></span>
</footer>
<script>
const $ = id => document.getElementById(id);
const CATS = ['背景', '过渡', '翻页', '片头', '交互'];
// 分类的英文名，显示成小字
const CAT_EN = { 背景: 'Backgrounds', 过渡: 'Theme Transitions', 翻页: 'Page Turn', 片头: 'Intro', 交互: 'Interactions' };
// 每个效果需要 effects.css 里的哪几段样式（base 总是带上）
const CSS_OF = id => id.startsWith('theme-') ? ['tt', 'vfx'] : ({ pull: ['pd'], 'sun-moon': ['sm', 'ui-center', 'sm-stage'], 'glow-card': ['gc'], scramble: ['sc'], 'follow-tip': ['ft'], pipeline: ['pl'] })[id] || ['canvas'];
const list = MH.effects.slice().sort((a, b) => CATS.indexOf(a.cat) - CATS.indexOf(b.cat));
$('count').textContent = `${list.length} 个效果 · ${CATS.length} 类`;

// 左侧名单：按分类分组，每类标数量
// 序号在每个分类里从 01 重新开始
$('list').innerHTML = CATS.map(c => {
  const items = list.filter(e => e.cat === c);
  return `<h2>${c}<em>${CAT_EN[c]}</em><span>${items.length}</span></h2>` + items.map((e, i) => `<button type="button" data-id="${e.id}"><i>${String(i + 1).padStart(2, '0')}</i>${e.name}</button>`).join('');
}).join('');

// 舞台：同一时间只运行一个效果；切换时销毁旧的
let cur = null, inst = null;
// 参数：每个效果调过的值单独记着（切走再切回来还在）；强调色是所有效果共用的
const vals = {};
let accent = '';
const valsOf = e => ({ ...MH.defaults(e), ...vals[e.id] });
// 把效果挂到舞台上（切换效果、改参数时都走这里）
function run(e) {
  if (inst) inst.destroy();
  $('stage').replaceChildren();
  // 强调色：舞台和舞台里自带 data-theme 的元素（过渡效果的浅色 / 深色小页面）都要覆盖，否则它们会用自己主题里的强调色
  $('accent-css').textContent = accent ? `#stage,#stage [data-theme]{--accent:${accent}}` : '';
  inst = e.mount($('stage'), { ...vals[e.id] }); inst.resume();
}
function select(id, push = true) {
  const e = list.find(x => x.id === id) || list[0];
  cur = e; run(e); renderParams(e);
  document.querySelectorAll('#list button').forEach(b => b.classList.toggle('on', b.dataset.id === e.id));
  document.querySelector(`#list button[data-id="${e.id}"]`).scrollIntoView({ block: 'nearest', inline: 'nearest' });
  $('cat').textContent = `${e.cat} · ${CAT_EN[e.cat]}`; $('name').textContent = e.name; $('desc').textContent = e.desc; $('tech').textContent = e.tech;
  showCode(e);
  if (push && location.hash !== '#' + e.id) history.replaceState(null, '', '#' + e.id);
}
// 参数面板：按效果的 params 生成控件；改动后稍等一下再重新挂载（拖滑块时不至于每一帧都重建），代码区跟着更新
const esc = v => String(v).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const fmt = (p, v) => p.type === 'range' ? `${+(+v).toFixed(3)}${p.unit || ''}` : '';
function renderParams(e) {
  const v = valsOf(e), ps = e.params || [];
  $('params').innerHTML = `<div class="ph"><b>参数</b><span>Params</span><button type="button" id="preset">恢复默认</button></div>` +
    ps.map(p => `<label class="pr"><span>${p.label}<em>${fmt(p, v[p.k])}</em></span>` + (
      p.type === 'range' ? `<input type="range" data-k="${p.k}" min="${p.min}" max="${p.max}" step="${p.step}" value="${v[p.k]}">`
      : p.type === 'lines' ? `<textarea data-k="${p.k}" rows="3" spellcheck="false">${esc(v[p.k])}</textarea>`
      : `<input type="text" data-k="${p.k}" value="${esc(v[p.k])}" spellcheck="false">`) + `</label>`).join('') +
    `<label class="pr pc"><span>强调色<em>${accent || '默认'}</em></span><input type="color" id="accent" value="${accent || getComputedStyle($('stage')).getPropertyValue('--accent').trim()}"></label>`;
}
let rerun = 0;
const later = (ms, e) => { clearTimeout(rerun); rerun = setTimeout(() => { if (cur === e) { run(e); showCode(e, true); } }, ms); };
$('params').addEventListener('input', ev => {
  const t = ev.target, e = cur;
  if (t.id === 'accent') { accent = t.value; t.previousElementSibling.querySelector('em').textContent = accent; return later(60, e); }
  const p = (e.params || []).find(x => x.k === t.dataset.k); if (!p) return;
  (vals[e.id] = vals[e.id] || {})[p.k] = p.type === 'range' ? +t.value : t.value;
  if (p.type === 'range') t.previousElementSibling.querySelector('em').textContent = fmt(p, t.value);
  later(p.type === 'range' ? 120 : 400, e);
});
$('params').addEventListener('click', ev => {
  if (ev.target.id !== 'preset') return;
  delete vals[cur.id]; accent = ''; renderParams(cur); run(cur); showCode(cur, true);
});
// 完整代码：把配色和效果样式、核心、这个效果所在的文件拼成一个能直接打开的 .html。
// 源文件内容优先从 src/sources.js（预先打包的字符串）取，所以双击 file:// 打开也能用；取不到再用 fetch。
const SRC = {};
const read = f => SRC[f] || (SRC[f] = window.MH_SOURCES && MH_SOURCES[f] != null
  ? Promise.resolve(MH_SOURCES[f])
  : fetch(f).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }));
// 从 effects.css 里按“@css 名称”标记取出需要的几段
const cssFor = (css, keys) => {
  const parts = {}; css.replace(/\/\* @css (\S+) \*\/\n([\s\S]*?)(?=\/\* @css |$)/g, (m, k, body) => { parts[k] = body.trim(); });
  return ['base', ...keys].map(k => parts[k] || '').filter(Boolean).join('\n\n');
};
// 复制代码：一个能单独打开的 .html，只带这个效果的文件和它用到的样式；
// 文件开头的注释就是给 AI 的提示词（效果、原理、参数、注意事项、代码结构），代码和说明是一份东西。
function header(e) {
  const P = (window.MH_PROMPTS || {})[e.id] || { look: e.desc, how: [], params: [], notes: [] };
  const list = a => a.map(x => `  - ${x}`).join('\n');
  const notes = [...P.notes, '颜色都来自 CSS 变量（paper / ink / dim / rule / accent），换成项目自己的颜色即可。', '要处理 prefers-reduced-motion：系统要求减少动态效果时只显示静止画面。', '组件卸载时要停掉动画循环、移除事件监听（mount 返回的 destroy）。'];
  return `<!--
  「${e.name}」 · Motion Hub · MIT + Commons Clause（可免费用于任何项目，不能售卖效果本身）

  【怎么用】
  这个文件可以直接双击打开，先看效果。
  想放进自己的项目：把整个文件交给 AI（Claude / ChatGPT / Cursor 等），再说一句你的技术栈和想要的调整，
  例如“把这个效果改写成 React 组件，放在首屏当背景，颜色换成我的品牌色”。下面的说明就是写给它看的。

  【效果】
  ${P.look}

  【实现原理】
${list(P.how)}

  【可以调的参数】
${list(P.params)}

  【注意】
${list(notes)}

  【opts 参数】（mount 的第二个参数，不传就用默认值；文件末尾的 mount 调用里是你在 Motion Hub 上调好的值）
${(e.params || []).map(p => `  - ${p.k}：${p.label}，默认 ${JSON.stringify(p.def)}${p.type === 'range' ? `（${p.min}–${p.max}${p.unit || ''}）` : ''}`).join('\n') || '  - 无'}

  【代码结构】
  - <style>：配色变量和这个效果用到的样式
  - 第一段 <script>：MH 核心（注册表、噪声、缓动；canvasHost 负责画布尺寸、指针坐标、动画循环和暂停）
  - 第二段 <script>：效果本身，核心是 MH.register 里的 mount(el, opts)，返回 { pause, resume, destroy }
  - 最后一段 <script>：把效果挂到 #fx 上并启动
-->`.replace(/-->(?=[\s\S]*-->$)/g, '->');
}
async function fullCode(e) {
  const [css, core, file] = await Promise.all([read('src/effects.css'), read('src/core.js'), read('src/effects/' + e.file)]);
  // 带上实验台里调好的参数；多行文字参数写成数组，方便阅读和修改
  const v = valsOf(e), o = Object.fromEntries((e.params || []).map(p => [p.k, p.type === 'lines' ? MH.lines(v[p.k]) : v[p.k]]));
  const opts = JSON.stringify(o, null, 2), color = accent ? `// 强调色（在 Motion Hub 上选的）；[data-theme] 也要覆盖，深浅两套主题才都用这个颜色\ndocument.head.insertAdjacentHTML('beforeend', '<style>:root,[data-theme]{--accent:${accent}}</style>');\n` : '';
  const run = color + (e.cat === '过渡'
    ? `// 舞台演示：点画面任意位置切换\nMH.effects.find(e => e.id === '${e.id}').mount(document.getElementById('fx'), ${opts}).resume();\n// 整页深浅切换（View Transitions，过渡播完前再点不生效）：\n// MH.bindThemeToggle(button, () => {\n//   const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'night' ? 'day' : 'night';\n// }, '${e.id.replace('theme-', '')}', { dur: ${o.dur} });`
    : `MH.effects.find(e => e.id === '${e.id}').mount(document.getElementById('fx'), ${opts}).resume();`);
  return `<!doctype html>
${header(e)}
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${e.name}</title>
<style>
${cssFor(css, CSS_OF(e.id))}
html,body{height:100%;margin:0;background:var(--paper)}
#fx{position:relative;height:100vh;overflow:hidden;container-type:size}
<\/style>
</head>
<body>
<div id="fx"></div>
<script>
${core.trim()}
<\/script>
<script>
${file.trim()}
<\/script>
<script>
${run}
<\/script>
</body>
</html>
`;
}
async function showCode(e, update = false) {
  if (!update) $('use').textContent = '正在生成…';
  try { const t = await fullCode(e); if (cur === e) { $('use').textContent = t; document.querySelectorAll('.copies button').forEach(b => b.disabled = false); } }
  catch (err) { $('use').textContent = '读取源码失败：' + err.message; document.querySelectorAll('.copies button').forEach(b => b.disabled = true); }
}
$('list').addEventListener('click', ev => { const b = ev.target.closest('button[data-id]'); if (b) select(b.dataset.id); });
// 上下方向键切换效果；当前是拉扯翻页时，方向键交给它翻页
addEventListener('keydown', ev => {
  if (cur && cur.id === 'pull') return;
  if (ev.target.closest && ev.target.closest('input, textarea')) return; // 在参数面板里输入或拖滑块时不切换效果
  if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
  ev.preventDefault();
  const i = list.indexOf(cur), j = (i + (ev.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length;
  select(list[j].id);
});
addEventListener('hashchange', () => select(location.hash.slice(1), false));
$('reset').addEventListener('click', () => run(cur));
$('full').addEventListener('click', () => { const s = $('stage'); document.fullscreenElement ? document.exitFullscreen() : s.requestFullscreen && s.requestFullscreen(); });
const copyWith = (id, make, ok) => $(id).addEventListener('click', async () => {
  const b = $(id), t0 = b.textContent;
  try { await navigator.clipboard.writeText(await make(cur)); b.textContent = ok; } catch (e) { b.textContent = '复制失败'; }
  setTimeout(() => b.textContent = t0, 1800);
});
copyWith('copy', fullCode, '已复制：存成 .html 能运行，交给 AI 能改');

// 深浅开关：图标和“太阳月亮开关”同一套；过渡是实验台专用的“胶囊展开”
(() => {
  const btn = $('mode'), rays = [0, 45, 90, 135, 180, 225, 270, 315].map(a => `<line x1="12" y1="2.5" x2="12" y2="4.5" transform="rotate(${a} 12 12)"/>`).join('');
  btn.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><mask id="mode-mask"><rect x="-4" y="-4" width="32" height="32" fill="#fff"/><circle class="bite" cx="28" cy="2" r="7.5" fill="#000"/></mask><circle class="core" cx="12" cy="12" r="5" fill="currentColor" mask="url(#mode-mask)"/><g class="rays" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">${rays}</g></svg>`;
  const dark = () => document.documentElement.dataset.theme === 'night';
  const label = () => { const t = dark() ? '切换到浅色模式' : '切换到深色模式'; btn.classList.toggle('moon', !dark()); btn.title = t; btn.setAttribute('aria-label', t); };
  label();
  const go = () => {
    if (dark()) delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = 'night';
    try { localStorage.setItem('mh-theme', dark() ? 'night' : 'day'); } catch (e) {}
    label();
  };
  // 实验台自己的深浅切换：胶囊展开（不用名单里那 11 个过渡）。
  // 新页面的可见区域是一个圆角矩形：先从按钮处横向拉成一条和屏幕一样宽的胶囊，再上下撑满整屏、圆角收成 0；
  // 旧页面同时以按钮为中心缩小一点、变暗，像往后退了一层。过渡播完之前再点不生效。
  let busy = false;
  btn.addEventListener('click', () => {
    const root = document.documentElement;
    if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) return go();
    if (busy) return;
    const r = btn.getBoundingClientRect(), W = innerWidth, H = innerHeight;
    const cy = r.top + r.height / 2, band = r.height * 1.6;
    // inset(上 右 下 左 round 圆角)：四条边分别离屏幕边缘多远
    const box = (t, rt, b, l, rad) => `inset(${t}px ${rt}px ${b}px ${l}px round ${rad}px)`;
    root.dataset.hubfx = '';
    root.style.setProperty('--hx', (r.left + r.width / 2) + 'px'); root.style.setProperty('--hy', cy + 'px');
    busy = true;
    const vt = document.startViewTransition(go);
    vt.ready.then(() => {
      const o = { duration: 900, fill: 'forwards' }; // fill：停在最后一帧，否则撤掉过渡层前会闪回旧颜色
      root.animate([
        { clipPath: box(r.top, W - r.right, H - r.bottom, r.left, r.height / 2), easing: 'cubic-bezier(.7,0,.3,1)' },
        { clipPath: box(cy - band / 2, 0, H - cy - band / 2, 0, band / 2), offset: .42, easing: 'cubic-bezier(.6,0,.15,1)' },
        { clipPath: box(0, 0, 0, 0, 0) }
      ], { ...o, pseudoElement: '::view-transition-new(root)' });
      root.animate([{ transform: 'scale(1)', filter: 'brightness(1)' }, { transform: 'scale(.94)', filter: 'brightness(.7)' }],
        { ...o, easing: 'cubic-bezier(.5,0,.2,1)', pseudoElement: '::view-transition-old(root)' });
    }).catch(() => {});
    vt.finished.finally(() => { busy = false; delete root.dataset.hubfx; });
  });
})();

select(location.hash.slice(1), false);
</script>
</body>
</html>
