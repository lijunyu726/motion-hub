<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Hub · 网页动效合集</title>
<link rel="icon" href="data:,">
<meta name="description" content="网页动效合集：背景、深浅切换过渡、拉扯翻页、片头与小交互。原生 JavaScript，无依赖。">
<script>
  // 先定深浅色再渲染，避免闪一下：本地记住的选择优先，否则跟随系统
  (() => { let m = null; try { m = localStorage.getItem('mh-theme'); } catch (e) {}
    if ((m || (matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day')) === 'night') document.documentElement.dataset.theme = 'night'; })();
</script>
<link rel="stylesheet" href="src/effects.css">
<link rel="stylesheet" href="src/hub.css">
<script src="src/core.js"></script>
<script src="src/effects/contour.js"></script>
<script src="src/effects/dots.js"></script>
<script src="src/effects/flow.js"></script>
<script src="src/effects/grid.js"></script>
<script src="src/effects/transitions.js"></script>
<script src="src/effects/pull.js"></script>
<script src="src/effects/intro.js"></script>
<script src="src/effects/sun-moon.js"></script>
<script src="src/effects/glow-card.js"></script>
<script src="src/effects/scramble.js"></script>
<script src="src/effects/follow-tip.js"></script>
<script src="src/effects/pipeline.js"></script>
<script src="src/prompts.js"></script>
<script src="src/sources.js"></script>
</head>
<body>
<header class="hd">
  <a class="logo" href="#">MOTION HUB</a>
  <span class="count" id="count"></span>
  <nav>
    <a href="https://github.com/lijunyu726/motion-hub" target="_blank" rel="noopener">GitHub</a>
    <button class="sm" id="mode" type="button"></button>
  </nav>
</header>
<div class="bench">
  <aside class="list" id="list" aria-label="效果列表"></aside>
  <main class="main">
    <div class="stage" id="stage"></div>
    <section class="info">
      <div>
        <div class="cat" id="cat"></div>
        <h1 id="name"></h1>
        <p id="desc"></p>
        <div class="tech" id="tech"></div>
        <div class="act"><button id="reset" type="button">↻ 重置</button><button id="full" type="button">⛶ 全屏</button></div>
      </div>
      <div class="use"><pre id="use"></pre><div class="copies"><button class="copy p" id="copy" type="button">复制代码</button></div></div>
    </section>
  </main>
</div>
<footer class="ft-bar">
  <span>MIT + Commons Clause · © 2026 LJY · 原生 JavaScript，无依赖</span>
  <span><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">鲁ICP备2026056774号-1</a></span>
</footer>
<script>
const $ = id => document.getElementById(id);
const CATS = ['背景', '过渡', '翻页', '片头', '交互'];
// 每个效果需要 effects.css 里的哪几段样式（base 总是带上）
const CSS_OF = id => id.startsWith('theme-') ? ['tt', 'vfx'] : ({ pull: ['pd'], 'sun-moon': ['sm', 'ui-center', 'sm-stage'], 'glow-card': ['gc'], scramble: ['sc'], 'follow-tip': ['ft'], pipeline: ['pl'] })[id] || ['canvas'];
const list = MH.effects.slice().sort((a, b) => CATS.indexOf(a.cat) - CATS.indexOf(b.cat));
$('count').textContent = `${list.length} 个效果 · ${CATS.length} 类`;

// 左侧名单：按分类分组，每类标数量
// 序号在每个分类里从 01 重新开始
$('list').innerHTML = CATS.map(c => {
  const items = list.filter(e => e.cat === c);
  return `<h2>${c}<span>${items.length}</span></h2>` + items.map((e, i) => `<button type="button" data-id="${e.id}"><i>${String(i + 1).padStart(2, '0')}</i>${e.name}</button>`).join('');
}).join('');

// 舞台：同一时间只运行一个效果；切换时销毁旧的
let cur = null, inst = null;
function select(id, push = true) {
  const e = list.find(x => x.id === id) || list[0];
  if (inst) inst.destroy();
  $('stage').replaceChildren();
  cur = e; inst = e.mount($('stage'), {}); inst.resume();
  document.querySelectorAll('#list button').forEach(b => b.classList.toggle('on', b.dataset.id === e.id));
  document.querySelector(`#list button[data-id="${e.id}"]`).scrollIntoView({ block: 'nearest', inline: 'nearest' });
  $('cat').textContent = e.cat; $('name').textContent = e.name; $('desc').textContent = e.desc; $('tech').textContent = e.tech;
  showCode(e);
  if (push && location.hash !== '#' + e.id) history.replaceState(null, '', '#' + e.id);
}
// 完整代码：把配色和效果样式、核心、这个效果所在的文件拼成一个能直接打开的 .html。
// 源文件内容优先从 src/sources.js（预先打包的字符串）取，所以双击 file:// 打开也能用；取不到再用 fetch。
const SRC = {};
const read = f => SRC[f] || (SRC[f] = window.MH_SOURCES && MH_SOURCES[f] != null
  ? Promise.resolve(MH_SOURCES[f])
  : fetch(f).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); }));
// 从 effects.css 里按“@css 名称”标记取出需要的几段
const cssFor = (css, keys) => {
  const parts = {}; css.replace(/\/\* @css (\S+) \*\/\n([\s\S]*?)(?=\/\* @css |$)/g, (m, k, body) => { parts[k] = body.trim(); });
  return ['base', ...keys].map(k => parts[k] || '').filter(Boolean).join('\n\n');
};
// 复制代码：一个能单独打开的 .html，只带这个效果的文件和它用到的样式；
// 文件开头的注释就是给 AI 的提示词（效果、原理、参数、注意事项、代码结构），代码和说明是一份东西。
function header(e) {
  const P = (window.MH_PROMPTS || {})[e.id] || { look: e.desc, how: [], params: [], notes: [] };
  const list = a => a.map(x => `  - ${x}`).join('\n');
  const notes = [...P.notes, '颜色都来自 CSS 变量（paper / ink / dim / rule / accent），换成项目自己的颜色即可。', '要处理 prefers-reduced-motion：系统要求减少动态效果时只显示静止画面。', '组件卸载时要停掉动画循环、移除事件监听（mount 返回的 destroy）。'];
  return `<!--
  「${e.name}」 · Motion Hub · MIT + Commons Clause（可免费用于任何项目，不能售卖效果本身）

  【怎么用】
  这个文件可以直接双击打开，先看效果。
  想放进自己的项目：把整个文件交给 AI（Claude / ChatGPT / Cursor 等），再说一句你的技术栈和想要的调整，
  例如“把这个效果改写成 React 组件，放在首屏当背景，颜色换成我的品牌色”。下面的说明就是写给它看的。

  【效果】
  ${P.look}

  【实现原理】
${list(P.how)}

  【可以调的参数】
${list(P.params)}

  【注意】
${list(notes)}

  【代码结构】
  - <style>：配色变量和这个效果用到的样式
  - 第一段 <script>：MH 核心（注册表、噪声、缓动；canvasHost 负责画布尺寸、指针坐标、动画循环和暂停）
  - 第二段 <script>：效果本身，核心是 MH.register 里的 mount(el, opts)，返回 { pause, resume, destroy }
  - 最后一段 <script>：把效果挂到 #fx 上并启动
-->`.replace(/-->(?=[\s\S]*-->$)/g, '->');
}
async function fullCode(e) {
  const [css, core, file] = await Promise.all([read('src/effects.css'), read('src/core.js'), read('src/effects/' + e.file)]);
  const run = e.cat === '过渡'
    ? `// 舞台演示：点画面任意位置切换\nMH.effects.find(e => e.id === '${e.id}').mount(document.getElementById('fx'), {}).resume();\n// 整页深浅切换（View Transitions，点一次切一次）：\n// MH.bindThemeToggle(button, () => {\n//   const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'night' ? 'day' : 'night';\n// }, '${e.id.replace('theme-', '')}');`
    : `MH.effects.find(e => e.id === '${e.id}').mount(document.getElementById('fx'), {}).resume();`;
  return `<!doctype html>
${header(e)}
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${e.name}</title>
<style>
${cssFor(css, CSS_OF(e.id))}
html,body{height:100%;margin:0;background:var(--paper)}
#fx{position:relative;height:100vh;overflow:hidden;container-type:size}
<\/style>
</head>
<body>
<div id="fx"></div>
<script>
${core.trim()}
<\/script>
<script>
${file.trim()}
<\/script>
<script>
${run}
<\/script>
</body>
</html>
`;
}
async function showCode(e) {
  $('use').textContent = '正在生成…';
  try { const t = await fullCode(e); if (cur === e) { $('use').textContent = t; document.querySelectorAll('.copies button').forEach(b => b.disabled = false); } }
  catch (err) { $('use').textContent = '读取源码失败：' + err.message; document.querySelectorAll('.copies button').forEach(b => b.disabled = true); }
}
$('list').addEventListener('click', ev => { const b = ev.target.closest('button[data-id]'); if (b) select(b.dataset.id); });
// 上下方向键切换效果；当前是拉扯翻页时，方向键交给它翻页
addEventListener('keydown', ev => {
  if (cur && cur.id === 'pull') return;
  if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
  ev.preventDefault();
  const i = list.indexOf(cur), j = (i + (ev.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length;
  select(list[j].id);
});
addEventListener('hashchange', () => select(location.hash.slice(1), false));
$('reset').addEventListener('click', () => select(cur.id));
$('full').addEventListener('click', () => { const s = $('stage'); document.fullscreenElement ? document.exitFullscreen() : s.requestFullscreen && s.requestFullscreen(); });
const copyWith = (id, make, ok) => $(id).addEventListener('click', async () => {
  const b = $(id), t0 = b.textContent;
  try { await navigator.clipboard.writeText(await make(cur)); b.textContent = ok; } catch (e) { b.textContent = '复制失败'; }
  setTimeout(() => b.textContent = t0, 1800);
});
copyWith('copy', fullCode, '已复制：存成 .html 能运行，交给 AI 能改');

// 深浅开关：图标和“太阳月亮开关”同一套；过渡固定为圆形揭开
(() => {
  const btn = $('mode'), rays = [0, 45, 90, 135, 180, 225, 270, 315].map(a => `<line x1="12" y1="2.5" x2="12" y2="4.5" transform="rotate(${a} 12 12)"/>`).join('');
  btn.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true"><mask id="mode-mask"><rect x="-4" y="-4" width="32" height="32" fill="#fff"/><circle class="bite" cx="28" cy="2" r="7.5" fill="#000"/></mask><circle class="core" cx="12" cy="12" r="5" fill="currentColor" mask="url(#mode-mask)"/><g class="rays" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">${rays}</g></svg>`;
  const dark = () => document.documentElement.dataset.theme === 'night';
  const label = () => { const t = dark() ? '切换到浅色模式' : '切换到深色模式'; btn.classList.toggle('moon', !dark()); btn.title = t; btn.setAttribute('aria-label', t); };
  label();
  // 实验台自己的深浅切换固定用圆形揭开，不跟着舞台上选中的效果变；点一次切一次，不用等过渡播完
  MH.bindThemeToggle(btn, () => {
    if (dark()) delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = 'night';
    try { localStorage.setItem('mh-theme', dark() ? 'night' : 'day'); } catch (e) {}
    label();
  }, 'circle');
})();

select(location.hash.slice(1), false);
</script>
</body>
</html>
