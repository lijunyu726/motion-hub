<body class="intro">
<canvas id="gl" aria-label="一颗正在过夜的地球：各地来的访问沿弧线飞到上海的腾讯云服务器。点城市看它这一天，点上海看这台服务器；按 1–4 换画法"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>

<header class="mast">
  <div class="ttl"><b>腾讯云服务器监控</b><span>上海 · 4 核</span><em class="demo" id="demo" hidden title="合成数据，不是真实访问">演示</em></div>

  <div class="when"><button type="button" id="when" aria-haspopup="dialog" aria-expanded="false" aria-controls="cal" title="打开日历，换一天看"><span id="whenT">——</span><span id="whenM">此刻</span></button><button type="button" id="back" hidden>回到此刻</button></div>

  <div class="tally" id="tally"></div>

</header>

    <h3 id="flowh">此刻</h3>
    <ol id="flow"></ol>
    <p class="quiet" id="quiet" hidden></p>

</aside>

<div class="colo" aria-hidden="true"><span>服务器监控</span><span class="s">上海</span><i>腾讯云</i></div>
