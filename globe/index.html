<!doctype html>
<html lang="zh-CN" data-style="deep" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>服务器监控地球 · Motion Hub</title>
<meta name="description" content="一颗按真实昼夜转动的地球，把各地来的访问画成飞向服务器的弧线；两种画法，合成的演示数据。">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="globe.css">
<link rel="stylesheet" href="panel.css">
<style>.mh-back{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;font:500 11px var(--sans);letter-spacing:.12em;color:var(--dim);text-decoration:none;padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:color-mix(in srgb,var(--bg) 70%,transparent)}
.mh-back:hover{color:var(--ink)}
.in-hub .mh-back{display:none}
@media (max-width:600px){.mh-back{top:auto;bottom:calc(58px + env(safe-area-inset-bottom));padding:2px 10px}}</style>
<script>if (self !== top) document.documentElement.classList.add('in-hub')</script>
</head>
<body class="intro">
<p class="boot" id="boot" role="status">正在载入地图…</p>
<canvas id="gl" aria-label="一颗正在过夜的地球：各地来的访问沿弧线飞到上海的服务器。点城市看它这一天，点上海看这台服务器；按 1、2 换画法"></canvas>
<canvas id="hud" aria-hidden="true"></canvas>

<!-- 没登录时：背后是星空（globe.js 锁着时只画天），正中一栏登录，样子和左右两栏一样（lock.js） -->
<div class="vault" id="vault" hidden>
  <form class="lock" id="lock" autocomplete="on" novalidate hidden>
    <div class="lh"><h3>登录</h3><span>street</span></div>
    <label class="fld"><span>账号</span><input name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label class="fld pw"><span>密码</span><input name="password" type="password" autocomplete="current-password" required><button type="button" class="eye" aria-pressed="false" aria-label="显示密码">显示</button></label>
    <label class="rem"><input name="remember" type="checkbox" checked><i></i>30 天内免登录</label>
    <button type="submit" class="go">登录</button>
    <p class="lst" id="lst" role="status" aria-live="polite" hidden><span></span></p>
  </form>
</div>

<header class="mast">
  <div class="ttl"><b>服务器监控</b><span>上海 · 4 核</span><em class="demo" id="demo" hidden title="合成数据，不是真实访问">演示</em><button type="button" class="out" id="out" hidden>退出</button></div>
  <p class="hostip" id="hostip"></p>
  <div class="alert" id="alert" aria-live="polite"></div>
  <div class="clock" id="clock">——</div>
  <div class="when"><button type="button" id="when" aria-haspopup="dialog" aria-expanded="false" aria-controls="cal" title="打开日历，换一天看"><span id="whenT">——</span><span id="whenM">此刻</span></button><button type="button" id="back" hidden>回到此刻</button></div>
  <div class="tally" id="tally"></div>
  <div class="legend" id="legend" aria-hidden="true"></div>
  <nav class="styles" id="styles" aria-label="画法"></nav>
</header>

<aside class="side">
  <section class="board" id="board" aria-label="八个站和服务器的状态"></section>
  <section class="from">
    <h3>人</h3>
    <ol id="humans"></ol>
    <h3 class="cold">机器<span>按网络</span></h3>
    <ol id="bots" class="cold"></ol>
  </section>
  <section class="flow">
    <h3 id="flowh">此刻</h3>
    <ol id="flow"></ol>
    <p class="quiet" id="quiet" hidden></p>
  </section>
</aside>

<p class="cap" id="cap" aria-live="polite"></p>
<div class="card" id="card" role="dialog" aria-label="下钻"></div>
<aside class="rig" id="rig" aria-label="这台服务器"></aside>
<div class="cal" id="cal" role="dialog" aria-label="日历：换一天看" hidden></div>

<footer class="deck">
  <button type="button" id="play" aria-label="暂停">
    <svg viewBox="0 0 16 16" class="i-pause"><rect x="4" y="3" width="2.4" height="10" rx=".6"/><rect x="9.6" y="3" width="2.4" height="10" rx=".6"/></svg>
    <svg viewBox="0 0 16 16" class="i-play"><path d="M5 3.2v9.6c0 .5.5.8.9.5l7.2-4.8a.6.6 0 0 0 0-1L5.9 2.7c-.4-.3-.9 0-.9.5z"/></svg>
  </button>
  <div class="tl"><canvas id="hist" aria-label="这一天 0 点到 24 点：上面一道细线是服务器的 CPU 和内存，下面是流量，暖色是人、冷色是机器，柱顶的红色是 5xx，轴下的红色细带是有站停着的时段；点一下或拖动就从那个时刻回放，← → 键前后跳 10 分钟"></canvas>
    <p class="tip" id="tip" aria-hidden="true"></p></div>
  <div class="spd" id="spd">
    <button type="button" data-s="replay" class="rp" title="从今天 0 点开始回放（键 ←）">回放今天</button><button type="button" data-s="60" title="回放倍速：1 秒走过 60 秒">60×</button><button type="button" data-s="120" title="回放倍速：1 秒走过 120 秒">120×</button><button type="button" data-s="600" title="回放倍速：1 秒走过 600 秒">600×</button><button type="button" data-s="live" class="now" title="回到此刻：实时访问">此刻</button>
  </div>
  <div class="note"></div>
</footer>
